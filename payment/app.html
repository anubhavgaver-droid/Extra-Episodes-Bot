<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14123A">
<title>Extra Episodes Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14123A;--card:#201D5C;--line:rgba(139,124,255,.3);--ink:#F5F3FF;--muted:#B7B1E8;--amber:#FFB547;--violet:#8B7CFF;--ok:#34D399;--bad:#FB7185}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.45;padding:max(16px,env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
.wrap{max-width:460px;margin:0 auto}
.sc{font-variant-caps:all-small-caps;letter-spacing:.06em}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 18px}
.top b{font-size:15px;letter-spacing:.09em}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;background:rgba(255,181,71,.15);color:var(--amber);font-size:14px}
h1{font-size:26px;line-height:1.15;margin:12px 0 10px}
.ep{color:var(--muted);margin-bottom:12px}.ep b{color:var(--ink)}
.price{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.price small{font-size:15px;color:var(--muted)}
.price b{font-size:42px;color:var(--amber);letter-spacing:-.01em;line-height:1.05}
.meta{color:var(--muted);font-size:14px}
.perks{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px;color:var(--muted);font-size:14px}
.perks li::before{content:"✦";color:var(--violet);margin-right:8px}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:inherit;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.primary{background:var(--amber);color:#1b1640}
.ghost{background:transparent;border:1px solid var(--line);margin-top:10px}
.notice{padding:12px 14px;border-radius:14px;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);font-size:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.amount{margin:10px 0 2px}.amount small{display:block;font-size:15px;color:var(--muted)}
.amount b{font-size:46px;color:var(--amber);letter-spacing:-.01em;line-height:1.05}
.timer{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:999px;background:rgba(139,124,255,.16);font-size:14px;margin-top:8px}
.h2{font-size:15px;margin:0 0 12px;color:var(--muted)}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.app{display:flex;align-items:center;gap:10px;padding:14px 12px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;transition:transform .08s}
.app:active{transform:scale(.97)}
.dot{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;flex:none}
.any{grid-column:1/-1;background:var(--amber);color:#1b1640;border-color:transparent;justify-content:center;font-size:16px;padding:16px}
.hint{font-size:13px;color:var(--muted);margin:12px 0 0;text-align:center}
.hint a{color:var(--amber);font-weight:700}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;color:var(--muted);font-size:15px}
.qr{display:block;margin:14px auto 4px;width:210px;height:210px;border-radius:16px;background:#fff;padding:8px}
.upi{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.22)}
.upi code{font-size:14px;word-break:break-all}
.copy{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.state{text-align:center;padding:34px 20px}.state .big{font-size:50px;margin-bottom:8px}
.state h2{margin:0 0 8px}.state p{margin:0;color:var(--muted)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:428px;margin:0 auto;padding:14px 16px;border-radius:16px;background:#2a2670;border:1px solid var(--line);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:9}
.toast.bad{border-color:rgba(251,113,133,.55)}
.foot{text-align:center;margin-top:18px}
.foot a{color:var(--muted);text-decoration:none;font-size:14px}
.skel{height:22px;border-radius:8px;background:rgba(255,255,255,.08);margin:10px 0;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.4}}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <svg width="38" height="32" viewBox="0 0 380 300" aria-hidden="true"><rect x="78" y="22" width="224" height="150" rx="26" fill="#8B7CFF" opacity=".35"/><rect x="54" y="52" width="248" height="166" rx="28" fill="#8B7CFF" opacity=".65"/><rect x="30" y="86" width="272" height="188" rx="32" fill="#FFB547"/><polygon points="136,132 136,228 224,180" fill="#14123A" stroke="#14123A" stroke-width="16" stroke-linejoin="round"/></svg>
    <b class="sc">extra episodes store</b>
  </div>
  <div id="view"><div class="card"><div class="skel"></div><div class="skel" style="width:60%"></div><div class="skel" style="height:70px"></div></div></div>
  <div class="foot"><a href="#" id="dev" class="sc">👨‍💻 developer</a></div>
</main>
<div id="toast" class="toast hidden"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#14123A'); tg.setBackgroundColor('#14123A'); } catch (e) {} }
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toString();
const itemId = location.pathname.split('/').pop();
const FRAMES = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
let ITEM = null, ORDER = null, tick = null, spin = null, toastT = null;

async function api(path, body) {
  const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.status) throw new Error(j.error || 'Request failed');
  return j;
}
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 30000);  // 30s baad hat jata hai
}
function openTg(url) { tg && tg.openTelegramLink ? tg.openTelegramLink(url) : (location.href = url); }
function state(icon, title, text, btn) {
  $('#view').innerHTML = `<div class="card state"><div class="big">${icon}</div><h2>${esc(title)}</h2><p>${esc(text)}</p></div>${btn || ''}`;
}

function showProduct() {
  const i = ITEM;
  $('#view').innerHTML = `
  <section class="card">
    <span class="chip sc">extra episode sharing</span>
    <h1>${esc(i.title)}</h1>
    ${i.desc ? `<div class="ep">🎞 <span class="sc">episodes</span> <b>${esc(i.desc)}</b></div>` : ''}
    <div class="price"><small class="sc">price</small><b>₹${fmt(i.price)}</b></div>
    <div class="meta">📁 ${i.files} file${i.files === 1 ? '' : 's'} · ⚡ instant delivery</div>
  </section>
  <ul class="perks"><li>Share extra episodes of any story</li><li>Get any link &amp; channel access instantly</li><li>Safe &amp; secure UPI payment</li></ul>
  ${i.auto ? '' : '<div class="notice">🛠 Automatic payment is under maintenance. You can pay manually below.</div>'}
  <button class="btn primary" id="pay" ${i.auto ? '' : 'disabled'}>💳 <span class="sc">pay ₹${fmt(i.price)} with upi</span></button>
  ${i.manual ? '<button class="btn ghost" id="man">🧾 <span class="sc">pay manually (screenshot)</span></button>' : ''}`;
  $('#pay').onclick = startPay;
  if ($('#man')) $('#man').onclick = () => { openTg(`https://t.me/${ITEM.bot}?start=man_${ITEM.id}`); tg && setTimeout(() => tg.close(), 400); };
}

async function startPay() {
  const b = $('#pay'); b.disabled = true; b.innerHTML = '⏳ <span class="sc">creating order…</span>';
  try {
    ORDER = await api('/api/order', {item: ITEM.id, initData: tg ? tg.initData : ''});
    showOrder();
  } catch (e) { toast('❌ ' + e.message, true); showProduct(); }
}

function links(o) {
  const p = `pa=${encodeURIComponent(o.upi_id)}&pn=${encodeURIComponent(o.upi_name || 'Pay')}&am=${Number(o.amount).toFixed(2)}&tn=${o.oid}&cu=INR`;
  return {gpay: `tez://upi/pay?${p}`, phonepe: `phonepe://pay?${p}`, paytm: `paytmmp://pay?${p}`, any: `upi://pay?${p}`};
}

function showOrder() {
  const o = ORDER, L = links(o), amt = Number(o.amount).toFixed(2);
  $('#view').innerHTML = `
  <section class="card">
    <div class="row muted"><span class="sc">order</span><code>${esc(o.oid)}</code></div>
    <div class="row" style="margin-top:10px"><b>${esc(o.title)}</b></div>
    <div class="amount"><small class="sc">pay exactly</small><b>₹${amt}</b></div>
    <div class="timer">⏱ <span id="t" class="sc">--:--</span></div>
  </section>
  <section class="card">
    <p class="h2 sc">choose your upi app</p>
    <div class="apps">
      <a class="app any" href="${L.any}">💳 <span class="sc">pay with any upi app</span></a>
      <a class="app" href="${L.gpay}"><span class="dot" style="background:#4285F4">G</span>Google Pay</a>
      <a class="app" href="${L.phonepe}"><span class="dot" style="background:#5F259F">Pe</span>PhonePe</a>
      <a class="app" href="${L.paytm}"><span class="dot" style="background:#00B9F1">Pt</span>Paytm</a>
      <a class="app" href="${L.any}"><span class="dot" style="background:#E86A33">₹</span>BHIM / Other</a>
    </div>
    <p class="hint">App didn't open? <a href="#" id="fb">Tap here</a></p>
    <details><summary class="sc">show qr code &amp; upi id</summary>
      <img class="qr" alt="UPI QR code" src="/api/qr/${encodeURIComponent(o.oid)}">
      <div class="upi"><div><div class="muted sc" style="font-size:13px">upi id</div><code>${esc(o.upi_id)}</code></div><button class="copy" id="copy">Copy</button></div>
    </details>
  </section>
  <button class="btn primary" id="ver">✅ <span class="sc">i've paid — verify</span></button>
  <button class="btn ghost" id="back">← <span class="sc">back</span></button>`;
  $('#fb').onclick = e => { e.preventDefault(); const u = location.origin + '/pay/' + o.oid; tg && tg.openLink ? tg.openLink(u) : window.open(u, '_blank'); };
  $('#copy').onclick = async () => {
    try { await navigator.clipboard.writeText(o.upi_id); } catch (e) {}
    $('#copy').textContent = 'Copied ✓'; setTimeout(() => $('#copy').textContent = 'Copy', 1800);
  };
  $('#ver').onclick = verify;
  $('#back').onclick = () => { clearInterval(tick); showProduct(); };
  const end = Date.now() + o.left * 1000;
  const upd = () => {
    const s = Math.max(0, Math.round((end - Date.now()) / 1000)), el = $('#t'); if (!el) return clearInterval(tick);
    el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') + ' left';
    if (s <= 0) { clearInterval(tick); state('⌛', 'Order expired', 'Please start again.', '<button class="btn primary" id="again">↻ Start again</button>'); $('#again').onclick = showProduct; }
  };
  clearInterval(tick); upd(); tick = setInterval(upd, 1000);
}

async function verify() {
  const b = $('#ver'); let i = 0; b.disabled = true;
  const label = () => b.innerHTML = `${FRAMES[i++ % 8]} <span class="sc">verifying payment…</span>`;
  label(); spin = setInterval(label, 450);
  try {
    const r = await api('/api/verify', {oid: ORDER.oid, initData: tg ? tg.initData : ''});
    clearInterval(spin);
    if (r.status === 'paid') return success();
    b.disabled = false; b.innerHTML = `✅ <span class="sc">i've paid — verify</span>`;
    if (r.status === 'pending') toast(`❌ Not verified yet. Make sure you paid exactly ₹${Number(ORDER.amount).toFixed(2)}, wait a minute and try again.`, true);
    else if (r.status === 'expired') { clearInterval(tick); state('⌛', 'Order expired', 'Please start again.', '<button class="btn primary" id="again">↻ Start again</button>'); $('#again').onclick = showProduct; }
    else if (r.status === 'busy') toast('⏳ Another order with the same amount is being verified. Try again shortly.', true);
    else if (r.status === 'closed') toast('⚠️ This order is closed.', true);
    else toast('⚠️ ' + (r.error || 'Verification error. Please try again.'), true);
  } catch (e) {
    clearInterval(spin); b.disabled = false; b.innerHTML = `✅ <span class="sc">i've paid — verify</span>`;
    toast('⚠️ ' + e.message, true);
  }
}

function success() {
  clearInterval(tick); $('#toast').classList.add('hidden');
  tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
  state('✅', 'Payment verified!', 'Your files are on their way to the chat.', '<button class="btn primary" id="close">Back to chat</button>');
  $('#close').onclick = () => tg ? tg.close() : history.back();
  if (tg) setTimeout(() => tg.close(), 3500);
}

(async () => {
  try {
    ITEM = await api('/api/item/' + encodeURIComponent(itemId));
    $('#dev').onclick = e => { e.preventDefault(); openTg('https://t.me/' + ITEM.dev); };
    showProduct();
  } catch (e) { state('⚠️', 'Link invalid', e.message); }
})();
</script>
</body>
</html>
